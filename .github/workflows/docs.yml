# docs/ と mkdocs.yml から MkDocs のサイトを作り、main への push で GitHub Pages に公開する。
# 公開には Settings → Pages → Source を "GitHub Actions" にしておく必要がある。
# リポジトリが非公開の間はビルドだけを確認として走らせ、公開はしない。
name: docs

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, pyproject.toml, uv.lock, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, pyproject.toml, uv.lock, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv は大きいバージョンのタグ（v10）を出していないので、版を固定する
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      # docs グループ（uv.lock で版を固定）だけを入れて作る
      - run: uv run --locked --only-group docs mkdocs build --strict
      - if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
